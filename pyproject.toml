[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "membank"
version = "0.1.0"
description = "Local-first, layered memory vault for AI coding agents"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
  "scikit-learn>=1.3,<2",
  "fastembed>=0.3,<1",
  "PyYAML>=6,<7",
  "tomli>=2,<3; python_version<'3.11'",
]

[project.optional-dependencies]
dev = ["ruff>=0.6", "mypy>=1.10"]

[project.scripts]
membank = "membank.cli:main"

[tool.setuptools]
packages = ["membank"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
